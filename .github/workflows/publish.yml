name: Publish to VS Code Marketplace

on:
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx vsce publish --no-rewrite-relative-links --pat "${{ secrets.VSCE_PAT }}"
